name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: Server — lint, test, smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PORT: 5000
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/mgm_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@mandir.com
      SEED_ADMIN_PASSWORD: Ci-Pass-123!
      SEED_ADMIN_NAME: CI Admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20          # same as server/Dockerfile
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Seed a fresh database
        run: npm run seed
      - name: Start the API
        run: |
          node src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && exit 0; sleep 1; done
          echo "API did not start"; exit 1
      - name: Smoke test every read endpoint
        run: node scripts/smoke.mjs
      - name: Sign-in sessions (multi-device, sign-out, old-token upgrade)
        run: node scripts/auth-check.mjs
      - name: Bookings (seat limits under parallel load, void, reports, P&L, public receipt)
        run: node scripts/booking-check.mjs
      - name: Stock FIFO, supplier payment approval, donations and 80G
        run: node scripts/rules-check.mjs
      - name: Attendance (joining / leaving / rejoining, month frozen once salary is finalised)
        run: node scripts/attendance-check.mjs
      - name: Request validation accepts what the screens send, refuses bad input
        run: node scripts/validation-check.mjs
      - name: Server log
        if: always()
        run: cat server.log || true

  android:
    name: Android test APK
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22          # Capacitor CLI needs 22+
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the mobile bundle and copy it into the Android project
        run: npm run build:mobile && npx cap sync android
      - name: Build debug APK
        working-directory: client/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mgm-mandir-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
