<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MGM Counter — Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #111827;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .brand { font-size: 22px; font-weight: 800; color: #f97316; margin-bottom: 4px; }
    .sub   { font-size: 14px; color: #6b7280; margin-bottom: 32px; }
    label  { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input  {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .hint  { font-size: 12px; color: #9ca3af; margin-top: 6px; }
    .error { font-size: 12px; color: #ef4444; margin-top: 6px; display: none; }
    button {
      display: block;
      width: 100%;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #ea6c0c; }
    button:disabled { background: #fdba74; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Mangal Grah Mandir</div>
    <div class="sub">First-time setup — enter your server URL to continue</div>

    <form id="form">
      <label for="url">Server URL <span style="color:#ef4444">*</span></label>
      <input
        id="url"
        type="text"
        placeholder="http://103.168.19.129"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="hint">IP address or domain name of the VPS running the MGM app</div>
      <div class="error" id="err"></div>
      <button id="btn" type="submit">Connect</button>
    </form>
  </div>

  <script>
    // Pre-fill saved URL if present
    window.electronAPI.getSettings().then((s) => {
      if (s && s.apiUrl) document.getElementById('url').value = s.apiUrl;
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = document.getElementById('url').value.trim().replace(/\/$/, '');
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');

      if (!url) return;

      btn.disabled    = true;
      btn.textContent = 'Connecting...';
      err.style.display = 'none';

      await window.electronAPI.saveSettings({ apiUrl: url });
      window.electronAPI.navigateTo(url);
    });
  </script>
</body>
</html>
