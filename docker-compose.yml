services:
  server:
    build:
      context: ./server
      target: production
    container_name: mgm_server
    restart: unless-stopped
    # MONGO_URI (Atlas connection string) comes from ./server/.env
    env_file: ./server/.env
    environment:
      - NODE_ENV=production
    networks:
      - mgm_net

  client:
    build:
      context: ./client
      target: production
    container_name: mgm_client
    restart: unless-stopped
    networks:
      - mgm_net

  nginx:
    image: nginx:alpine
    container_name: mgm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - server
      - client
    networks:
      - mgm_net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  certbot_www:
  certbot_conf:

networks:
  mgm_net:
    driver: bridge
