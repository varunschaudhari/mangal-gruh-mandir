services:
  server:
    build:
      context: .                     # repo root, so the image includes /shared
      dockerfile: server/Dockerfile
      target: production
    container_name: mgm_server
    restart: unless-stopped
    # MONGO_URI (Atlas connection string) comes from ./server/.env
    env_file: ./server/.env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kolkata          # temple runs on India time (also pinned in server/src/config/timezone.js)
    volumes:
      - ./server/uploads:/app/server/uploads               # expense receipts — on the host so rebuilds don't delete them
      - ./mobile-releases:/app/server/mobile-releases:ro   # Android app updates (MOBILE.md)
      # When the last backup finished and whether it left the server (backup-db.sh writes it;
      # /api/health/backup reads it for the uptime monitor)
      - ${BACKUP_DIR:-/var/backups/mgm}/status:/app/server/backup-status:ro
    networks:
      - mgm_net

  client:
    build:
      context: .                     # repo root, so the build includes /shared
      dockerfile: client/Dockerfile
      target: production
    container_name: mgm_client
    restart: unless-stopped
    networks:
      - mgm_net

  nginx:
    image: nginx:alpine
    container_name: mgm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Filled into nginx/templates/app.conf.template at start-up (set DOMAIN in the root .env)
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=mandir.aumora.io}
    # Reloads every 6 hours so a certificate renewed by certbot (below) is picked up. Then starts
    # nginx through the image's own entry script, which still fills in the templates.
    entrypoint: ["/bin/sh", "-c", "while :; do sleep 21600 & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./docs/manual:/usr/share/nginx/html/manual:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    # Empty, writable conf.d: holds only the filled-in template (hides the image's default site)
    tmpfs:
      - /etc/nginx/conf.d
    depends_on:
      - server
      - client
    networks:
      - mgm_net

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    # Checks twice a day and renews the certificate once it has under 30 days left; nginx reloads
    # within 6 hours. No cron job needed. (init-letsencrypt.sh replaces this for its one-off runs.)
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --no-random-sleep-on-renew; sleep 43200 & wait $${!}; done"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  certbot_www:
  certbot_conf:

networks:
  mgm_net:
    driver: bridge
