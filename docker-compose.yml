version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: mgm_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: mgm_stock
    volumes:
      - mongo_data:/data/db
    networks:
      - mgm_net

  server:
    build:
      context: ./server
      target: production
    container_name: mgm_server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/mgm_stock?authSource=mgm_stock
    depends_on:
      - mongodb
    networks:
      - mgm_net

  client:
    build:
      context: ./client
      target: production
    container_name: mgm_client
    restart: unless-stopped
    networks:
      - mgm_net

  nginx:
    image: nginx:alpine
    container_name: mgm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - server
      - client
    networks:
      - mgm_net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  mongo_data:
  certbot_www:
  certbot_conf:

networks:
  mgm_net:
    driver: bridge
