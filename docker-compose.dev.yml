version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: mgm_mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - mgm_dev_net

  server:
    build:
      context: ./server
      target: development
    container_name: mgm_server_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server/src:/app/src
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/mgm_stock_dev
      - JWT_SECRET=dev_secret_change_in_production
      - JWT_EXPIRES_IN=1d
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - mgm_dev_net

volumes:
  mongo_dev_data:

networks:
  mgm_dev_net:
    driver: bridge
